# Alacritty config, styled to match the kitty setup (font, padding, colors).
# colors.toml is generated from the current wallpaper theme by the quickshell
# color system (scripts/colors/applycolor.sh).

[general]
import = ["~/.config/alacritty/colors.toml"]

[terminal]
shell = { program = "fish" }

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[window]
padding = { x = 22, y = 22 }
opacity = 1.0

[cursor]
style = { shape = "Beam", blinking = "Off" }
