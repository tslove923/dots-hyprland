# Custom keybinds for Hyprland (hyprlang format)
# NOTE: This is the legacy .conf reference. The TUI generates keybinds.lua for Hyprland 0.55+.
# See also: ~/.config/hypr/hyprland/keybinds.lua for upstream defaults
#
# Commented-out binds are handled by upstream or QuickShell:
#   Super+Return/T/Ctrl+Alt+T → Terminal (upstream keybinds.lua)
#   Super+E → File manager (upstream)
#   Super+W → Browser (upstream)
#   Super+C → Code editor (upstream)
#   Super+X → Text editor (upstream)
#   Super+I → Settings (upstream)
#   Ctrl+Super+V → Volume mixer (upstream)
#   Ctrl+Shift+Escape → Task manager (upstream)
#   Ctrl+Super+Shift+Alt+W → Office (upstream)

##! Services
bind = Super+Alt, D, exec, ~/.config/hypr/custom/scripts/toggle_docker.sh # Toggle Docker on/off
bind = Super+Alt, B, exec, kitty "bluetui" # Bluetooth TUI
bind = Super+Alt, V, exec, ~/.config/hypr/custom/scripts/vpn_toggle.sh # VPN toggle (requires vpn-indicator feature)

##! Workspace Management
$mainMod = super

# Move active window to workspace (Super+Shift+N)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch to next/previous workspace on current monitor
bind = $mainMod Alt, Right, workspace, +1
bind = $mainMod Alt, Left, workspace, -1

##! Touchscreen & Rotation
# Auto-rotation toggle (see custom/scripts/toggle-rotation.sh)
bind = Super, R, exec, ~/.config/hypr/custom/scripts/toggle-rotation.sh

# Voice trigger (voxd)
bind = Super, Z, exec, bash -c 'voxd --trigger-record'

# Power button → dpms off (laptops/tablets). `bindl` fires even when lock
# inhibitors are active.
bindl = , XF86PowerOff, exec, hyprctl dispatch dpms off

# Minimize active window to the special "minimized" workspace
bind = Super, H, movetoworkspacesilent, special:minimized

# Move active window to the previous workspace on this monitor
bind = Super, U, movetoworkspacesilent, e-1
