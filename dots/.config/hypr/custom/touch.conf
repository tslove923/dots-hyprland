# hyprlang noerror false
# Touch gesture configuration via the hyprgrass plugin.
# Source-excluded by default on machines without a touchscreen or without
# hyprgrass installed — the wrapping `# hyprlang noerror true` in hyprland.conf
# makes a missing file non-fatal.
#
# Requires:
#   - hyprgrass plugin (loaded via `hyprpm reload -n` in custom/execs.conf)
#   - quickshell globals: sidebarRightToggle, sidebarLeftToggle, oskToggle
#     (provided by the ii quickshell config)
#
# Sensitivity defaults to 1.0; raised to 4.0 for tablet touchscreens.

plugin {
  touch_gestures {
    sensitivity = 4.0

    workspace_swipe_fingers = 3
    workspace_swipe_edge = d

    long_press_delay = 400
    resize_on_border_long_press = true

    edge_margin = 10

    # Edge swipes
    hyprgrass-bind = , edge:r:l, global, quickshell:sidebarRightToggle
    hyprgrass-bind = , edge:l:l, global, quickshell:sidebarRightToggle
    hyprgrass-bind = , edge:l:r, global, quickshell:sidebarLeftToggle
    hyprgrass-bind = , edge:l:d, exec, pactl set-sink-volume @DEFAULT_SINK@ -4%
    hyprgrass-bind = , edge:u:d, exec, pkill -SIGUSR2 nwg-drawer
    hyprgrass-bind = , edge:u:u, exec, pkill -SIGRTMIN+3 nwg-drawer
    hyprgrass-bind = , edge:d:u, global, quickshell:oskToggle

    # Multi-finger gestures
    hyprgrass-bind = , swipe:4:d, killactive
    hyprgrass-bind = , swipe:3:u, overview:toggle

    # Long press window manipulation
    hyprgrass-bindm = , longpress:2, movewindow
    hyprgrass-bindm = , longpress:3, resizewindow
  }
}