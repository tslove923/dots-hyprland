# hyprlang noerror false
# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
# exec-once = fcitx5

# NetworkManager secret agent (provides WiFi password handling to NM)
# GDK_BACKEND=x11 prevents the tray icon on Wayland while keeping the agent running
exec-once = env GDK_BACKEND=x11 nm-applet

# Hyprland plugin manager — loads plugins declared in hyprload.toml,
# including hyprgrass (touch gestures). -n = non-interactive.
exec-once = hyprpm reload -n

# Auto-rotate screen based on accelerometer input. Toggleable via
# ~/.config/hypr/rotation-toggle (see toggle-rotation.sh keybind).
exec-once = ~/.config/hypr/custom/scripts/rotate-screen.sh

# nwg-drawer in --refresh mode for swipe-gesture triggers (SIGUSR2 / SIGRTMIN+3).
exec-once = nwg-drawer -r

